<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地區星星統計</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      font-family: "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      background:
        linear-gradient(180deg, rgba(12,35,64,.06), rgba(244,247,250,0) 280px),
        #f4f7fa;
    }
    .rotary-blue { background: linear-gradient(135deg, #0c2340 0%, #173b66 72%, #8a704c 160%); }
    .rotary-gold { color: #8a704c; }
    .section {
      background: rgba(255,255,255,.96);
      border: 1px solid rgba(138,112,76,.16);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(12,35,64,.08);
    }
    .metric-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid #e5e7eb;
      box-shadow: inset 0 3px 0 rgba(138,112,76,.45);
    }
    .month-active { background: #0c2340; color: #fff; border-color: #0c2340; }
    .month-idle { background: #fff; color: #475569; border-color: #e5e7eb; }
  </style>
</head>
<body class="text-slate-800">
  <nav class="rotary-blue text-white px-4 md:px-6 py-4">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded bg-yellow-400/15 border border-yellow-400/30 flex items-center justify-center">
          <i class="fa-solid fa-globe text-yellow-400 text-2xl"></i>
        </div>
        <div>
          <h1 class="text-xl md:text-2xl font-black">地區星星統計</h1>
          <p class="text-xs text-slate-300">獨立統計地區活動、地區任務與地區星數</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <a href="index.html" class="text-sm border border-white/20 bg-white/10 px-3 py-1 rounded text-white font-semibold w-fit hover:bg-white/15">社友星星</a>
        <a href="district-stars.html" class="text-sm border border-yellow-500/40 bg-yellow-500/10 px-3 py-1 rounded text-yellow-300 font-semibold w-fit hover:bg-yellow-500/20">地區星星</a>
        <a href="attendance.html" class="text-sm border border-white/20 bg-white/10 px-3 py-1 rounded text-white font-semibold w-fit hover:bg-white/15">例會出席</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
    <section class="section p-5 md:p-6">
      <div class="grid grid-cols-1 lg:grid-cols-[1fr_.9fr] gap-6">
        <div>
          <p class="text-sm font-bold rotary-gold">台北中山扶輪社 2026-27</p>
          <h2 class="text-3xl md:text-5xl font-black mt-2 leading-tight">地區星星進度</h2>
          <div id="summaryCards" class="mt-6 grid grid-cols-2 lg:grid-cols-4 gap-3"></div>
        </div>
        <div class="metric-card rounded-lg p-5">
          <div class="flex items-end justify-between gap-3">
            <div>
              <p class="text-xs font-bold text-slate-500">地區年度目標</p>
              <p class="text-2xl font-black mt-1"><span id="districtStars">0 星</span> <span class="text-sm text-slate-500">/ 2,000 星</span></p>
            </div>
            <p id="progressRate" class="text-3xl font-black rotary-gold">0%</p>
          </div>
          <div class="w-full h-4 bg-white border border-slate-200 rounded-full overflow-hidden mt-3">
            <div id="progressBar" class="h-full bg-gradient-to-r from-amber-500 to-emerald-500 rounded-full" style="width:0%"></div>
          </div>
          <p class="text-xs text-slate-500 mt-3">只計算摘星紀錄中歸類為地區的資料。</p>
        </div>
      </div>
    </section>

    <section class="section p-5 md:p-6">
      <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-5">
        <div>
          <h2 class="text-xl font-black flex items-center gap-2"><i class="fa-solid fa-calendar-days rotary-gold"></i><span id="monthTitle">月份統計</span></h2>
          <p class="text-sm text-slate-500 mt-1">切換月份後，排行榜與明細會同步更新。</p>
        </div>
        <div id="monthTabs" class="flex gap-2 overflow-x-auto"></div>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-[.85fr_1.15fr] gap-5">
        <div>
          <h3 class="font-black mb-3">地區排行榜</h3>
          <div class="overflow-x-auto rounded border border-slate-100">
            <table class="w-full text-left min-w-[520px]">
              <thead class="bg-slate-50 text-slate-500 text-xs font-bold border-b border-slate-100">
                <tr><th class="py-3 px-4 text-center">排名</th><th class="py-3 px-4">姓名</th><th class="py-3 px-4 text-right">本月</th><th class="py-3 px-4 text-right">年度</th></tr>
              </thead>
              <tbody id="rankBody" class="divide-y divide-slate-50 text-sm"></tbody>
            </table>
          </div>
        </div>
        <div>
          <div class="flex items-center justify-between gap-3 mb-3">
            <h3 id="recordListTitle" class="font-black">地區明細</h3>
            <button id="clearMemberBtn" class="hidden text-xs font-bold rotary-gold hover:underline" type="button">查看全部</button>
          </div>
          <div id="recordList" class="space-y-2 max-h-[520px] overflow-y-auto"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="text-center py-8 text-xs text-slate-400">台北中山扶輪社 2026-27 地區星星統計</footer>

  <script>
    const googleSheet = {
      id: "167BBJdlNlOXLwFeudMwI_74680hfCHax",
      membersGid: "135569316",
      districtRecordsGid: "1651462493"
    };
    const districtGoal = 2000;
    let members = [];
    let records = [];
    let selectedMonth = "";
    let selectedMember = "";

    const sheetUrl = (gid) => `https://docs.google.com/spreadsheets/d/${googleSheet.id}/export?format=csv&gid=${gid}`;

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;
      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];
        if (char === "\"" && quoted && next === "\"") {
          cell += "\"";
          i += 1;
        } else if (char === "\"") {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          row.push(cell);
          cell = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") i += 1;
          row.push(cell);
          if (row.some((value) => value.trim())) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }
      row.push(cell);
      if (row.some((value) => value.trim())) rows.push(row);
      const headers = rows.shift() || [];
      return rows.map((values) => Object.fromEntries(headers.map((header, index) => [header.replace(/^\uFEFF/, "").trim(), values[index] || ""])));
    }

    function parseNumber(value) {
      const match = String(value || "").match(/\d+/);
      return match ? Number(match[0]) : 0;
    }

    function parseDate(value) {
      const text = String(value || "").trim();
      const match = text.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
      return match ? `${match[1]}-${String(match[2]).padStart(2, "0")}-${String(match[3]).padStart(2, "0")}` : text;
    }

    function monthKey(dateText) {
      const match = String(dateText || "").match(/^(\d{4})-(\d{2})/);
      return match ? `${match[1]}-${match[2]}` : "";
    }

    function monthLabel(key) {
      const parts = String(key || "").split("-");
      return parts.length === 2 ? `${Number(parts[1])}月` : key;
    }

    function fmt(dateText) {
      const date = new Date(`${dateText}T00:00:00`);
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function memberKey(name) {
      return String(name || "").replace(/\s/g, "").toLowerCase();
    }

    function memberTotal(member, month = "") {
      return records
        .filter((record) => memberKey(record.name) === memberKey(member.name))
        .filter((record) => !month || monthKey(record.date) === month)
        .reduce((sum, record) => sum + record.stars, 0);
    }

    function render() {
      const total = records.reduce((sum, record) => sum + record.stars, 0);
      const months = [...new Set(records.map((record) => monthKey(record.date)).filter(Boolean))].sort();
      if (!selectedMonth) selectedMonth = months[0] || "";
      const monthRecords = records.filter((record) => monthKey(record.date) === selectedMonth);
      const monthTotal = monthRecords.reduce((sum, record) => sum + record.stars, 0);
      const ranked = members
        .map((member) => ({ ...member, yearStars: memberTotal(member), monthStars: memberTotal(member, selectedMonth) }))
        .filter((member) => member.yearStars > 0 || member.monthStars > 0)
        .sort((a, b) => b.yearStars - a.yearStars || b.monthStars - a.monthStars || a.name.localeCompare(b.name));
      const monthWinner = [...ranked].sort((a, b) => b.monthStars - a.monthStars || a.name.localeCompare(b.name))[0];
      const rate = Math.min(Math.round(total / districtGoal * 100), 100);

      districtStars.textContent = `${total.toLocaleString()} 星`;
      progressRate.textContent = `${rate}%`;
      progressBar.style.width = `${rate}%`;
      summaryCards.innerHTML = [
        ["地區總星數", `${total.toLocaleString()} 星`],
        [`${monthLabel(selectedMonth)}地區星`, `${monthTotal.toLocaleString()} 星`],
        ["地區摘星王", monthWinner && monthWinner.monthStars > 0 ? `${monthWinner.name} ${monthWinner.monthStars} 星` : "-"],
        ["地區活動紀錄", `${monthRecords.length} 筆`]
      ].map(([label, value]) => `<div class="metric-card rounded p-4"><p class="text-xs text-slate-500">${label}</p><p class="text-xl font-black mt-1">${value}</p></div>`).join("");

      monthTabs.innerHTML = months.map((month) => `<button class="px-3 py-2 rounded border text-sm font-bold ${month === selectedMonth ? "month-active" : "month-idle"}" data-month="${month}">${monthLabel(month)}</button>`).join("");
      document.querySelectorAll("[data-month]").forEach((button) => button.addEventListener("click", () => {
        selectedMonth = button.dataset.month;
        render();
      }));

      if (selectedMember && !ranked.some((member) => memberKey(member.name) === memberKey(selectedMember))) {
        selectedMember = "";
      }
      const detailRecords = selectedMember
        ? monthRecords.filter((record) => memberKey(record.name) === memberKey(selectedMember))
        : monthRecords;

      rankBody.innerHTML = ranked.map((member, index) => {
        const isSelected = memberKey(member.name) === memberKey(selectedMember);
        return `<tr class="cursor-pointer ${isSelected ? "bg-amber-50 hover:bg-amber-50" : "hover:bg-slate-50"}" data-member="${member.name}">
        <td class="py-3 px-4 text-center font-black text-slate-500">${index + 1}</td>
        <td class="py-3 px-4 font-bold">
          <div class="flex items-center gap-2">
            <span>${member.name}</span>
            <span class="text-xs text-slate-400">${member.role}</span>
            ${isSelected ? `<span class="text-[11px] px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">明細</span>` : ""}
          </div>
        </td>
        <td class="py-3 px-4 text-right">${member.monthStars} 星</td>
        <td class="py-3 px-4 text-right font-black rotary-gold">${member.yearStars} 星</td>
      </tr>`;
      }).join("");
      document.querySelectorAll("[data-member]").forEach((row) => row.addEventListener("click", () => {
        selectedMember = selectedMember === row.dataset.member ? "" : row.dataset.member;
        render();
      }));

      recordListTitle.textContent = selectedMember ? `${selectedMember} 地區明細` : "地區明細";
      clearMemberBtn.classList.toggle("hidden", !selectedMember);
      clearMemberBtn.onclick = () => {
        selectedMember = "";
        render();
      };

      recordList.innerHTML = detailRecords.length ? detailRecords
        .sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name))
        .map((record) => `<div class="bg-white border border-amber-100 rounded p-3 flex items-center justify-between gap-3">
          <div>
            <p class="text-xs text-slate-500">${fmt(record.date)} ${record.name}</p>
            <p class="font-bold">${record.activity}</p>
          </div>
          <p class="font-black rotary-gold shrink-0">+${record.stars} 星</p>
        </div>`).join("") : `<div class="text-center text-slate-500 py-8">${selectedMember ? "這位社友本月暫無地區星星紀錄" : "目前沒有地區星星紀錄"}</div>`;
    }

    async function loadData() {
      if (!googleSheet.districtRecordsGid) {
        members = [];
        records = [];
        render();
        return;
      }

      const [membersCsv, recordsCsv] = await Promise.all([
        fetch(sheetUrl(googleSheet.membersGid)).then((response) => response.text()),
        fetch(sheetUrl(googleSheet.districtRecordsGid)).then((response) => response.text())
      ]);
      members = parseCsv(membersCsv)
        .filter((row) => row["姓名"])
        .map((row) => ({ name: row["姓名"], role: row["身份"] || "社友", status: row["狀態"] || "啟用" }))
        .filter((member) => member.status !== "停用");
      records = parseCsv(recordsCsv)
        .map((row) => ({
          name: row["姓名"],
          date: parseDate(row["日期"]),
          activity: row["活動"] || "",
          stars: parseNumber(row["星數"] || row["星系"]),
        }))
        .filter((record) => record.name && record.date && record.stars > 0);
      render();
    }

    loadData().catch(() => {
      members = [];
      records = [];
      render();
    });
  </script>
</body>
</html>
