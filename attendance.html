<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>例會出席與徽章</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      font-family: "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      background:
        linear-gradient(180deg, rgba(12,35,64,.06), rgba(244,247,250,0) 280px),
        #f4f7fa;
    }
    .rotary-blue { background: linear-gradient(135deg, #0c2340 0%, #173b66 72%, #8a704c 160%); }
    .rotary-gold { color: #8a704c; }
    .section {
      background: rgba(255,255,255,.96);
      border: 1px solid rgba(138,112,76,.16);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(12,35,64,.08);
    }
    .metric-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid #e5e7eb;
      box-shadow: inset 0 3px 0 rgba(138,112,76,.45);
    }
    .pill-yes { background: #dcfce7; color: #166534; }
    .pill-no { background: #fee2e2; color: #991b1b; }
    .month-active { background: #0c2340; color: #fff; border-color: #0c2340; }
    .month-idle { background: #fff; color: #475569; border-color: #e5e7eb; }
  </style>
</head>
<body class="text-slate-800">
  <nav class="rotary-blue text-white px-4 md:px-6 py-4">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded bg-yellow-400/15 border border-yellow-400/30 flex items-center justify-center">
          <i class="fa-solid fa-circle-check text-yellow-400 text-2xl"></i>
        </div>
        <div>
          <h1 class="text-xl md:text-2xl font-black">例會出席與徽章</h1>
          <p class="text-xs text-slate-300">只統計是否出席、是否配戴扶輪徽章</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <a href="index.html" class="text-sm border border-white/20 bg-white/10 px-3 py-1 rounded text-white font-semibold w-fit hover:bg-white/15">社友星星</a>
        <a href="district-stars.html" class="text-sm border border-white/20 bg-white/10 px-3 py-1 rounded text-white font-semibold w-fit hover:bg-white/15">地區星星</a>
        <a href="attendance.html" class="text-sm border border-yellow-500/40 bg-yellow-500/10 px-3 py-1 rounded text-yellow-300 font-semibold w-fit hover:bg-yellow-500/20">例會出席</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
    <section class="section p-5 md:p-6">
      <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
        <div>
          <p class="text-sm font-bold rotary-gold">台北中山扶輪社 2026-27</p>
          <h2 id="pageTitle" class="text-3xl md:text-4xl font-black mt-2 leading-tight">例會出席總覽</h2>
        </div>
        <div id="monthTabs" class="flex gap-2 overflow-x-auto"></div>
      </div>
      <div id="summaryCards" class="mt-6 grid grid-cols-2 lg:grid-cols-4 gap-3"></div>
    </section>

    <section class="section p-5 md:p-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-4">
        <h2 class="text-xl font-black flex items-center gap-2"><i class="fa-solid fa-clipboard-user rotary-gold"></i><span id="tableTitle">出席明細</span></h2>
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
          <input id="searchInput" type="text" placeholder="搜尋社員" class="pl-9 pr-4 py-2 border border-slate-200 rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full md:w-64">
        </div>
      </div>
      <div class="overflow-x-auto rounded border border-slate-100">
        <table class="w-full text-left min-w-[760px]">
          <thead id="attendanceHead" class="bg-slate-50 text-slate-500 text-xs font-bold border-b border-slate-100"></thead>
          <tbody id="attendanceBody" class="divide-y divide-slate-50 text-sm"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="text-center py-8 text-xs text-slate-400">台北中山扶輪社 2026-27 例會出席與徽章</footer>

  <script>
    const googleSheet = {
      id: "167BBJdlNlOXLwFeudMwI_74680hfCHax",
      attendanceGid: "927575057"
    };
    const fallbackDataUrl = "data/attendance-records.csv";
    const sheetUrl = (gid) => `https://docs.google.com/spreadsheets/d/${googleSheet.id}/export?format=csv&gid=${gid}`;
    let rows = [];
    let selectedMonth = "";
    let sortState = { key: "name", direction: "asc" };

    function parseCsv(text) {
      const result = [];
      let row = [];
      let cell = "";
      let quoted = false;
      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];
        if (char === "\"" && quoted && next === "\"") {
          cell += "\"";
          i += 1;
        } else if (char === "\"") {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          row.push(cell);
          cell = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") i += 1;
          row.push(cell);
          if (row.some((value) => value.trim())) result.push(row);
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }
      row.push(cell);
      if (row.some((value) => value.trim())) result.push(row);
      const headers = result.shift() || [];
      return result.map((values) => Object.fromEntries(headers.map((header, index) => [header.replace(/^\uFEFF/, ""), values[index] || ""])));
    }

    function hasAttendanceColumns(data) {
      if (!data.length) return false;
      const required = ["姓名", "日期", "例會", "是否出席", "是否配戴扶輪徽章"];
      return required.every((key) => Object.prototype.hasOwnProperty.call(data[0], key));
    }

    function monthKey(dateText) {
      const match = String(dateText || "").match(/^(\d{4})-(\d{2})/);
      return match ? `${match[1]}-${match[2]}` : "";
    }

    function monthLabel(key) {
      const parts = String(key || "").split("-");
      return parts.length === 2 ? `${Number(parts[1])}月` : key;
    }

    function fmt(dateText) {
      const date = new Date(`${dateText}T00:00:00`);
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function isYes(value) {
      return String(value || "").trim() === "是";
    }

    function meetingsForMonth(month) {
      const seen = new Map();
      rows.filter((row) => monthKey(row["日期"]) === month).forEach((row) => {
        seen.set(row["日期"], row["例會"]);
      });
      return [...seen.entries()].map(([date, title]) => ({ date, title })).sort((a, b) => a.date.localeCompare(b.date));
    }

    function render() {
      const months = [...new Set(rows.map((row) => monthKey(row["日期"])).filter(Boolean))].sort();
      if (!selectedMonth) selectedMonth = months[0] || "";
      monthTabs.innerHTML = months.map((month) => `<button class="px-3 py-2 rounded border text-sm font-bold ${month === selectedMonth ? "month-active" : "month-idle"}" data-month="${month}">${monthLabel(month)}</button>`).join("");
      document.querySelectorAll("[data-month]").forEach((button) => button.addEventListener("click", () => {
        selectedMonth = button.dataset.month;
        render();
      }));

      const monthRows = rows.filter((row) => monthKey(row["日期"]) === selectedMonth);
      const meetings = meetingsForMonth(selectedMonth);
      const members = [...new Set(monthRows.map((row) => row["姓名"]).filter(Boolean))].sort((a, b) => a.localeCompare(b));
      const possible = meetings.length * members.length;
      const present = monthRows.filter((row) => isYes(row["是否出席"])).length;
      const badge = monthRows.filter((row) => isYes(row["是否配戴扶輪徽章"])).length;
      const presentRate = possible ? Math.round(present / possible * 100) : 0;
      const badgeRate = present ? Math.round(badge / present * 100) : 0;

      pageTitle.textContent = `${monthLabel(selectedMonth)}例會出席總覽`;
      summaryCards.innerHTML = [
        ["例會場次", `${meetings.length}`],
        ["社員人數", `${members.length}`],
        ["出席率", `${presentRate}%`],
        ["徽章配戴率", `${badgeRate}%`]
      ].map(([label, value]) => `<div class="metric-card rounded p-4"><p class="text-xs text-slate-500">${label}</p><p class="text-2xl font-black mt-1">${value}</p></div>`).join("");

      const sortIcon = (key) => sortState.key === key ? (sortState.direction === "desc" ? "fa-arrow-down-wide-short" : "fa-arrow-up-wide-short") : "fa-sort";
      attendanceHead.innerHTML = `<tr>
        <th class="py-3 px-4">姓名</th>
        ${meetings.map((meeting) => `<th class="py-3 px-4 text-center">${fmt(meeting.date)}<span class="block font-normal">${meeting.title}</span></th>`).join("")}
        <th class="py-3 px-4 text-right">
          <button class="inline-flex items-center justify-end gap-1 hover:text-slate-900" data-sort-key="present">
            出席 <i class="fa-solid ${sortIcon("present")} text-[10px]"></i>
          </button>
        </th>
        <th class="py-3 px-4 text-right">
          <button class="inline-flex items-center justify-end gap-1 hover:text-slate-900" data-sort-key="badge">
            徽章 <i class="fa-solid ${sortIcon("badge")} text-[10px]"></i>
          </button>
        </th>
      </tr>`;
      document.querySelectorAll("[data-sort-key]").forEach((button) => button.addEventListener("click", () => {
        const key = button.dataset.sortKey;
        sortState = {
          key,
          direction: sortState.key === key && sortState.direction === "desc" ? "asc" : "desc"
        };
        render();
      }));
      renderBody(meetings, members);
    }

    function renderBody(meetings, members) {
      const keyword = searchInput.value.trim().toLowerCase();
      const memberRows = members.map((name) => {
        let presentTotal = 0;
        let badgeTotal = 0;
        const cells = meetings.map((meeting) => {
          const record = rows.find((row) => row["姓名"] === name && row["日期"] === meeting.date);
          const present = record && isYes(record["是否出席"]);
          const badge = record && isYes(record["是否配戴扶輪徽章"]);
          if (present) presentTotal += 1;
          if (badge) badgeTotal += 1;
          return `<td class="py-3 px-4 text-center">
            <span class="${present ? "pill-yes" : "pill-no"} text-xs font-bold px-2 py-1 rounded">${present ? "出席" : "未出席"}</span>
            <span class="block mt-1 ${badge ? "text-emerald-700" : "text-slate-400"} text-xs font-bold">${badge ? "有徽章" : "-"}</span>
          </td>`;
        }).join("");
        return { name, presentTotal, badgeTotal, cells };
      });
      const filtered = memberRows
        .filter((member) => member.name.toLowerCase().includes(keyword))
        .sort((a, b) => {
          if (sortState.key === "present") {
            return sortState.direction === "desc" ? b.presentTotal - a.presentTotal || a.name.localeCompare(b.name) : a.presentTotal - b.presentTotal || a.name.localeCompare(b.name);
          }
          if (sortState.key === "badge") {
            return sortState.direction === "desc" ? b.badgeTotal - a.badgeTotal || a.name.localeCompare(b.name) : a.badgeTotal - b.badgeTotal || a.name.localeCompare(b.name);
          }
          return a.name.localeCompare(b.name);
        });
      attendanceBody.innerHTML = filtered.map(({ name, presentTotal, badgeTotal, cells }) => {
        return `<tr class="hover:bg-slate-50">
          <td class="py-3 px-4 font-black">${name}</td>
          ${cells}
          <td class="py-3 px-4 text-right font-black">${presentTotal}</td>
          <td class="py-3 px-4 text-right font-black rotary-gold">${badgeTotal}</td>
        </tr>`;
      }).join("");
    }

    async function loadData() {
      try {
        const response = await fetch(sheetUrl(googleSheet.attendanceGid), { cache: "no-store" });
        if (!response.ok) throw new Error("missing Google Sheet attendance data");
        const sheetRows = parseCsv(await response.text());
        if (!hasAttendanceColumns(sheetRows)) throw new Error("invalid Google Sheet attendance data");
        rows = sheetRows;
      } catch (error) {
        const response = await fetch(fallbackDataUrl, { cache: "no-store" });
        if (!response.ok) throw new Error("missing attendance data");
        const fallbackRows = parseCsv(await response.text());
        rows = hasAttendanceColumns(fallbackRows) ? fallbackRows : [];
      }
      render();
    }

    searchInput.addEventListener("input", () => render());
    loadData();
  </script>
</body>
</html>
